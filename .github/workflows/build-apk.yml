
name: Build APK
on:
  push:
    paths:
      - '*.html'
      - 'docs-entry.js'
      - 'assets/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install packages
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor-community/text-to-speech@6 @capacitor/assets@3 esbuild pdfjs-dist@4.10.38 mammoth@1.8.0 jszip@3.10.1
      - name: Prepare web files (bundle speech and document readers)
        run: |
          mkdir -p www
          cp "$(ls *.html | head -n1)" www/index.html
          cat > tts-entry.js <<'JS'
          import { Capacitor, registerPlugin } from '@capacitor/core';
          import { TextToSpeech } from '@capacitor-community/text-to-speech';
          window.__TTS = Capacitor.isNativePlatform() ? TextToSpeech : null;
          window.__VOL = Capacitor.isNativePlatform() ? registerPlugin('SystemVolume') : null;
          window.__BG = Capacitor.isNativePlatform() ? registerPlugin('ReaderPlayback') : null;
          JS
          npx esbuild tts-entry.js --bundle --format=iife --minify --outfile=www/tts.js
          SCRIPTS='<script src="tts.js"></script>'
          if [ -f docs-entry.js ]; then
            npx esbuild docs-entry.js --bundle --format=iife --minify --outfile=www/docs.js
            SCRIPTS="$SCRIPTS"$'\n''<script src="docs.js"></script>'
          else
            echo "docs-entry.js not found: PDF, Word and PowerPoint reading will be skipped"
          fi
          SCRIPTS="$SCRIPTS" python3 - <<'PY'
          import os
          p = 'www/index.html'
          s = open(p, encoding='utf-8').read()
          s = s.replace('<script>', os.environ['SCRIPTS'] + '\n<script>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
      - name: Create Android project
        run: |
          npx cap init Reader com.reader.app --web-dir=www
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Add system volume plugin
        run: |
          DIR=android/app/src/main/java/com/reader/app
          cat > $DIR/SystemVolumePlugin.java <<'JAVA'
          package com.reader.app;

          import android.content.Context;
          import android.media.AudioManager;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          // Reads and sets the phone's real media volume (the one the volume buttons change).
          @CapacitorPlugin(name = "SystemVolume")
          public class SystemVolumePlugin extends Plugin {
              private AudioManager audio() {
                  return (AudioManager) getContext().getSystemService(Context.AUDIO_SERVICE);
              }

              @PluginMethod
              public void getVolume(PluginCall call) {
                  AudioManager am = audio();
                  JSObject ret = new JSObject();
                  ret.put("level", am.getStreamVolume(AudioManager.STREAM_MUSIC));
                  ret.put("max", am.getStreamMaxVolume(AudioManager.STREAM_MUSIC));
                  call.resolve(ret);
              }

              @PluginMethod
              public void setVolume(PluginCall call) {
                  Integer level = call.getInt("level");
                  if (level == null) { call.reject("level is required"); return; }
                  AudioManager am = audio();
                  int max = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC);
                  am.setStreamVolume(AudioManager.STREAM_MUSIC, Math.max(0, Math.min(max, level)), 0);
                  call.resolve();
              }
          }
          JAVA
          cat > $DIR/MainActivity.java <<'JAVA'
          package com.reader.app;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.media.AudioManager;
          import android.os.Build;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SystemVolumePlugin.class);
                  registerPlugin(ReaderPlaybackPlugin.class);
                  super.onCreate(savedInstanceState);
                  // hardware volume buttons control media volume while the app is open
                  setVolumeControlStream(AudioManager.STREAM_MUSIC);
                  // Android 13+: allow the playback notification (lock screen / notification shade controls)
                  if (Build.VERSION.SDK_INT >= 33
                          && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 7001);
                  }
              }
          }
          JAVA
          # background reading: foreground service + notification / lock screen controls
          cat > $DIR/ReaderPlaybackService.java <<'JAVA'
          package com.reader.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.ServiceInfo;
          import android.graphics.drawable.Icon;
          import android.media.AudioAttributes;
          import android.media.AudioFocusRequest;
          import android.media.AudioManager;
          import android.media.MediaMetadata;
          import android.media.session.MediaSession;
          import android.media.session.PlaybackState;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.speech.tts.Voice;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;
          import java.util.Locale;

          // Reads the document aloud from a foreground service, so playback keeps going with the
          // screen off or the app minimized, and shows a media notification / lock screen controls.
          public class ReaderPlaybackService extends Service {

              public interface Listener {
                  void onSentence(int index, int gen);
                  void onState(boolean playing, int index, boolean ended);
                  void onError(String message);
              }

              static final String CHANNEL = "reader_playback";
              static final int NOTIF_ID = 4242;
              static final String A_PLAY = "com.reader.app.PLAY";
              static final String A_TOGGLE = "com.reader.app.TOGGLE";
              static final String A_NEXT = "com.reader.app.NEXT";
              static final String A_PREV = "com.reader.app.PREV";
              static final String A_STOP = "com.reader.app.STOP";

              // Shared with the Capacitor plugin (which fills these in before starting the service).
              static final List<String> sentences = Collections.synchronizedList(new ArrayList<String>());
              static volatile int index = 0;
              static volatile boolean playing = false;
              static volatile int gen = -1;          // -1 = last change came from the phone (notification, headset, ...)
              static volatile String title = "Reader";
              static volatile float rate = 1f;
              static volatile String voiceKey = "";
              static volatile String lang = "en-US";
              static volatile Listener listener;
              static volatile ReaderPlaybackService instance;

              private Handler handler;
              private AudioManager audio;
              private NotificationManager nm;
              private MediaSession session;
              private TextToSpeech tts;
              private boolean ttsReady = false;
              private boolean pendingStart = false;
              private int token = 0;       // bumps on every flush so stale callbacks are ignored
              private int queuedTo = -1;   // last sentence handed to the speech engine
              private boolean resumeOnFocus = false;
              private boolean noisyRegistered = false;
              private String appliedVoice = null;
              private PowerManager.WakeLock wakeLock;
              private AudioFocusRequest focusReq;

              // ---------------- lifecycle ----------------
              @Override
              public void onCreate() {
                  super.onCreate();
                  instance = this;
                  handler = new Handler(Looper.getMainLooper());
                  audio = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                  nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel(CHANNEL, "Reading playback", NotificationManager.IMPORTANCE_LOW);
                      ch.setShowBadge(false);
                      ch.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                      nm.createNotificationChannel(ch);
                  }
                  session = new MediaSession(this, "Reader");
                  session.setCallback(new MediaSession.Callback() {
                      @Override public void onPlay() { userPlay(); }
                      @Override public void onPause() { userPause(); }
                      @Override public void onSkipToNext() { userJump(1); }
                      @Override public void onSkipToPrevious() { userJump(-1); }
                      @Override public void onStop() { userStop(); }
                  });
                  session.setActive(true);
                  tts = new TextToSpeech(getApplicationContext(), new TextToSpeech.OnInitListener() {
                      @Override public void onInit(final int status) {
                          handler.post(new Runnable() { @Override public void run() { onTtsInit(status); } });
                      }
                  });
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  startForegroundCompat();
                  String a = intent == null ? null : intent.getAction();
                  if (A_PLAY.equals(a)) userPlayFromJs();
                  else if (A_TOGGLE.equals(a)) { if (playing) userPause(); else userPlay(); }
                  else if (A_NEXT.equals(a)) userJump(1);
                  else if (A_PREV.equals(a)) userJump(-1);
                  else if (A_STOP.equals(a)) userStop();
                  return START_NOT_STICKY;
              }

              @Override public IBinder onBind(Intent intent) { return null; }

              @Override
              public void onTaskRemoved(Intent rootIntent) {   // app swiped away from recents
                  stopAll(true);
                  super.onTaskRemoved(rootIntent);
              }

              @Override
              public void onDestroy() {
                  releaseWake();
                  unregisterNoisy();
                  abandonFocus();
                  try { if (tts != null) { tts.stop(); tts.shutdown(); } } catch (Exception e) {}
                  try { if (session != null) { session.setActive(false); session.release(); } } catch (Exception e) {}
                  if (instance == this) instance = null;
                  playing = false;
                  super.onDestroy();
              }

              private void startForegroundCompat() {
                  Notification n = buildNotification();
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                  } else {
                      startForeground(NOTIF_ID, n);
                  }
              }

              // ---------------- speech engine ----------------
              private void onTtsInit(int status) {
                  if (status != TextToSpeech.SUCCESS) {
                      ttsReady = false;
                      playing = false;
                      Listener l = listener;
                      if (l != null) l.onError("Speech engine could not start");
                      refresh();
                      return;
                  }
                  ttsReady = true;
                  tts.setAudioAttributes(new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_MEDIA)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                          .build());
                  tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                      @Override public void onStart(final String id) {
                          handler.post(new Runnable() { @Override public void run() { utteranceStarted(id); } });
                      }
                      @Override public void onDone(final String id) {
                          handler.post(new Runnable() { @Override public void run() { utteranceDone(id); } });
                      }
                      @Override public void onError(final String id) {
                          handler.post(new Runnable() { @Override public void run() { utteranceError(id); } });
                      }
                  });
                  if (pendingStart) { pendingStart = false; speakFrom(index); }
              }

              private static String uid(int tok, int i) { return tok + "_" + i; }

              private int[] parseId(String id) {
                  try {
                      int u = id.indexOf('_');
                      return new int[]{Integer.parseInt(id.substring(0, u)), Integer.parseInt(id.substring(u + 1))};
                  } catch (Exception e) { return null; }
              }

              private String textAt(int i) {
                  try { return sentences.get(i); } catch (Exception e) { return ""; }
              }

              private void applyVoice() {
                  String key = voiceKey + "|" + lang;
                  if (key.equals(appliedVoice)) return;
                  appliedVoice = key;
                  try {
                      Voice found = null;
                      if (voiceKey != null && voiceKey.length() > 0) {
                          java.util.Set<Voice> all = tts.getVoices();
                          if (all != null) {
                              for (Voice v : all) {
                                  if (voiceKey.equals(v.getName())) { found = v; break; }
                              }
                          }
                      }
                      if (found != null) tts.setVoice(found);
                      else tts.setLanguage(Locale.forLanguageTag(lang == null || lang.length() == 0 ? "en-US" : lang));
                  } catch (Exception e) { /* keep the engine's default voice */ }
              }

              // Starts speaking at sentence i and keeps the next one queued, so there is no gap between sentences.
              private void speakFrom(int i) {
                  if (i < 0) i = 0;
                  if (i >= sentences.size()) { finishBook(); return; }
                  index = i;
                  playing = true;
                  if (!ttsReady) { pendingStart = true; refresh(); return; }
                  requestFocus();
                  acquireWake();
                  registerNoisy();
                  applyVoice();
                  tts.setSpeechRate(rate);
                  token++;
                  queuedTo = i;
                  int r = tts.speak(textAt(i), TextToSpeech.QUEUE_FLUSH, null, uid(token, i));
                  if (r != TextToSpeech.SUCCESS) {
                      // sentence the engine refused (e.g. too long): skip it
                      if (i + 1 < sentences.size()) { speakFrom(i + 1); return; }
                      finishBook();
                      return;
                  }
                  queueAhead();
                  refresh();
              }

              private void queueAhead() {
                  int next = queuedTo + 1;
                  if (playing && ttsReady && next < sentences.size() && next <= index + 1) {
                      int r = tts.speak(textAt(next), TextToSpeech.QUEUE_ADD, null, uid(token, next));
                      if (r == TextToSpeech.SUCCESS) queuedTo = next;
                  }
              }

              private void utteranceStarted(String id) {
                  int[] p = parseId(id);
                  if (p == null || p[0] != token || !playing) return;
                  index = p[1];
                  Listener l = listener;
                  if (l != null) l.onSentence(index, gen);
                  queueAhead();
                  refresh();
              }

              private void utteranceDone(String id) {
                  int[] p = parseId(id);
                  if (p == null || p[0] != token || !playing) return;
                  if (p[1] >= sentences.size() - 1) { finishBook(); return; }
                  queueAhead();
              }

              private void utteranceError(String id) {
                  int[] p = parseId(id);
                  if (p == null || p[0] != token || !playing) return;
                  pauseNow(true, true);
                  Listener l = listener;
                  if (l != null) l.onError("Speech error");
              }

              // ---------------- state changes ----------------
              private void pauseNow(boolean emit, boolean abandon) {
                  playing = false;
                  pendingStart = false;
                  token++;
                  try { if (tts != null) tts.stop(); } catch (Exception e) {}
                  releaseWake();
                  unregisterNoisy();
                  if (abandon) abandonFocus();
                  if (emit) { gen = -1; Listener l = listener; if (l != null) l.onState(false, index, false); }
                  refresh();
              }

              private void finishBook() {
                  playing = false;
                  token++;
                  releaseWake();
                  unregisterNoisy();
                  abandonFocus();
                  Listener l = listener;
                  if (l != null) l.onState(false, index, true);
                  stopForeground(true);
                  stopSelf();
              }

              private void stopAll(boolean emit) {
                  playing = false;
                  pendingStart = false;
                  token++;
                  try { if (tts != null) tts.stop(); } catch (Exception e) {}
                  releaseWake();
                  unregisterNoisy();
                  abandonFocus();
                  if (emit) { gen = -1; Listener l = listener; if (l != null) l.onState(false, index, false); }
                  stopForeground(true);
                  stopSelf();
              }

              // From the web page (gen identifies that req
