<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F4F0E8">
<title>Reader</title>
<style>
  :root {
    /* original palette, untouched */
    --paper: #F4F0E8;
    --paper-dim: #E8E1D2;
    --ink: #1C1A17;
    --ink-soft: #5A5348;
    --red: #7E2A25;
    --red-deep: #5C1F1B;
    --gold: #B08A3E;
    --gold-soft: #DCC894;

    /* supporting tokens derived from the palette */
    --surface: #FFFDF9;
    --line: rgba(28, 26, 23, 0.12);
    --gold-wash: rgba(220, 200, 148, 0.32);
    --shadow-card: 0 1px 2px rgba(28, 26, 23, 0.05), 0 8px 24px rgba(28, 26, 23, 0.06);
    --shadow-float: 0 2px 4px rgba(28, 26, 23, 0.05), 0 16px 40px rgba(28, 26, 23, 0.14);

    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-read: "Iowan Old Style", "Palatino Linotype", Palatino, Charter, Georgia, serif;
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background:
      radial-gradient(70% 38% at 50% 0%, var(--gold-wash), transparent 70%),
      var(--paper);
    background-attachment: fixed;
  }

  button { font-family: inherit; }

  /* ---------- layout shell ---------- */
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  .view { flex: 1; display: none; flex-direction: column; min-height: 0; }
  .view.active { display: flex; }

  /* ---------- setup view ---------- */
  #setup {
    padding: max(36px, env(safe-area-inset-top)) 20px max(32px, env(safe-area-inset-bottom));
    overflow-y: auto;
  }
  #setup > * { width: 100%; max-width: 640px; margin-inline: auto; flex-shrink: 0; }

  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }

  .brand-mark {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    background: var(--red);
    color: var(--gold-soft);
    display: grid;
    place-items: center;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08), 0 6px 16px rgba(126, 42, 37, 0.28);
  }

  #setup h1 {
    font-family: var(--font-read);
    font-size: 2.1rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin: 0;
  }

  #setup .sub {
    color: var(--ink-soft);
    font-size: 1rem;
    line-height: 1.5;
    margin: 0 0 28px;
  }

  .dropzone {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    border: 1.5px dashed var(--gold);
    border-radius: 22px;
    padding: 28px 20px;
    text-align: center;
    background: rgba(255, 253, 249, 0.55);
    color: var(--ink-soft);
    font-size: 0.95rem;
    line-height: 1.5;
    cursor: pointer;
    margin-bottom: 18px;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s var(--ease);
  }
  .dropzone-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--gold-soft);
    color: var(--red-deep);
    transition: transform 0.25s var(--ease);
  }
  .dropzone:hover { background: var(--surface); border-color: var(--red); }
  .dropzone:hover .dropzone-icon { transform: translateY(-2px); }
  .dropzone.dragover { border-color: var(--gold); background: var(--gold-soft); color: var(--ink); transform: scale(1.01); }
  .dropzone.dragover .dropzone-icon { background: var(--surface); }
  .dropzone strong { color: var(--ink); font-weight: 650; }
  #fileInput { display: none; }

  #pasteText {
    display: block;
    min-height: 220px;
    padding: 18px 20px;
    border: 1px solid var(--line);
    border-radius: 22px;
    background: var(--surface);
    box-shadow: var(--shadow-card);
    font-family: var(--font-read);
    font-size: 1.05rem;
    line-height: 1.7;
    color: var(--ink);
    resize: vertical;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  #pasteText::placeholder { color: var(--ink-soft); opacity: 0.7; }
  #pasteText:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 4px rgba(176, 138, 62, 0.22), var(--shadow-card);
  }

  #startBtn {
    display: block;
    margin-top: 18px;
    padding: 17px;
    border: none;
    border-radius: 16px;
    background: var(--red);
    color: #fff;
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(126, 42, 37, 0.3);
    transition: transform 0.15s var(--ease), box-shadow 0.15s var(--ease), background 0.15s ease;
  }
  #startBtn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(126, 42, 37, 0.34); }
  #startBtn:disabled { background: var(--ink-soft); opacity: 0.45; cursor: default; box-shadow: none; }
  #startBtn:active:not(:disabled) { background: var(--red-deep); transform: translateY(0); box-shadow: 0 4px 10px rgba(126, 42, 37, 0.3); }

  #setupNote { font-size: 0.85rem; color: var(--ink-soft); margin-top: 12px; min-height: 1.3em; text-align: center; }

  /* ---------- player view ---------- */
  #playerTopbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: max(12px, env(safe-area-inset-top)) max(14px, calc((100% - 720px) / 2)) 10px;
    border-bottom: 1px solid var(--line);
    background: rgba(244, 240, 232, 0.8);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
  }

  #backBtn {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    border: none;
    background: none;
    color: var(--ink);
    font-size: 0.95rem;
    font-weight: 500;
    padding: 8px 14px 8px 8px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  #backBtn:hover { background: var(--paper-dim); }

  #docTitle {
    flex: 1;
    min-width: 0;
    font-size: 0.95rem;
    font-weight: 550;
    color: var(--ink-soft);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #settingsBtn {
    border: none;
    background: none;
    color: var(--ink);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  #settingsBtn:hover { background: var(--paper-dim); }

  #sentences {
    flex: 1;
    overflow-y: auto;
    padding: 32px max(20px, calc((100% - 680px) / 2)) 22vh;
    font-family: var(--font-read);
    font-size: var(--read-size, 1.2rem);
    line-height: var(--read-lh, 1.8);
    letter-spacing: 0.003em;
    scrollbar-width: thin;
    scrollbar-color: var(--gold-soft) transparent;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 28px, #000 calc(100% - 28px), transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0, #000 28px, #000 calc(100% - 28px), transparent 100%);
  }

  .sentence {
    padding: 6px 14px;
    margin: 2px -14px;
    border-radius: 14px;
    cursor: pointer;
    transition: background 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
  }
  @media (hover: hover) {
    .sentence:hover { background: var(--gold-wash); }
    .sentence.current:hover { background: var(--red); }
  }
  .sentence.current {
    background: var(--red);
    color: #fff;
    box-shadow: 0 8px 22px rgba(126, 42, 37, 0.25);
  }
  .sentence.word-active { text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness: 2px; }

  /* ---------- transport bar ---------- */
  #transportBar {
    flex-shrink: 0;
    width: calc(100% - 24px);
    max-width: 680px;
    margin: 0 auto max(12px, env(safe-area-inset-bottom));
    padding: 6px 22px 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 30px;
    box-shadow: var(--shadow-float);
  }

  #progressWrap { padding: 20px 0 12px; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }
  #progressWrap.scrubbing #progressFill { transition: none; }
  #progressFill::after { transition: transform 0.15s var(--ease); }
  #progressWrap.scrubbing #progressFill::after { transform: scale(1.5); }
  #transportBar { position: relative; }
  #scrubPreview {
    position: absolute;
    left: 0; right: 0; bottom: calc(100% + 10px);
    padding: 10px 14px;
    background: var(--ink);
    color: var(--paper);
    border-radius: 16px;
    box-shadow: var(--shadow-float);
    font-family: var(--font-read);
    font-size: 0.92rem;
    line-height: 1.45;
    opacity: 0;
    transform: translateY(6px);
    pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s var(--ease);
  }
  #scrubPreview.show { opacity: 1; transform: translateY(0); }
  #scrubPreview .scrub-count { display: block; font-family: var(--font-ui); font-size: 0.75rem; color: var(--gold-soft); margin-bottom: 3px; font-variant-numeric: tabular-nums; }
  #scrubPreview .scrub-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #progressTrack { height: 6px; background: var(--paper-dim); border-radius: 3px; position: relative; }
  #progressFill {
    height: 100%;
    background: var(--gold);
    border-radius: 3px;
    width: 0%;
    position: relative;
    transition: width 0.3s var(--ease);
  }
  #progressFill::after {
    content: "";
    position: absolute;
    right: -8px;
    top: 50%;
    width: 16px;
    height: 16px;
    margin-top: -8px;
    border-radius: 50%;
    background: var(--gold);
    border: 3px solid var(--surface);
    box-shadow: 0 1px 4px rgba(28, 26, 23, 0.3);
  }
  #progressMeta {
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    margin-top: 10px;
  }

  .transport {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding-top: 4px;
  }

  .icon-btn {
    border: none;
    background: transparent;
    color: var(--ink);
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .icon-btn:hover { background: var(--paper-dim); }
  .icon-btn:active { transform: scale(0.92); }
  .icon-btn:focus-visible, #settingsBtn:focus-visible, #startBtn:focus-visible,
  #backBtn:focus-visible, .play-btn:focus-visible, #closeSettings:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  .play-btn {
    width: 72px; height: 72px;
    border-radius: 50%;
    border: none;
    background: var(--red);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 0 0 6px rgba(126, 42, 37, 0.1), 0 10px 22px rgba(126, 42, 37, 0.35);
    transition: transform 0.12s var(--ease), box-shadow 0.12s var(--ease), background 0.15s ease;
  }
  .play-btn:hover { background: var(--red-deep); }
  .play-btn:active { transform: scale(0.95); box-shadow: 0 0 0 4px rgba(126, 42, 37, 0.12), 0 4px 10px rgba(126, 42, 37, 0.3); }

  /* ---------- settings sheet ---------- */
  #settingsSheet {
    position: fixed;
    inset: auto 0 0 0;
    max-width: 520px;
    margin-inline: auto;
    background: var(--surface);
    border-radius: 28px 28px 0 0;
    padding: 26px 24px max(28px, env(safe-area-inset-bottom));
    transform: translateY(100%);
    visibility: hidden;
    transition: transform 0.3s var(--ease), visibility 0s linear 0.3s;
    z-index: 10;
    max-height: 88dvh;
    overflow-y: auto;
    box-shadow: 0 -12px 40px rgba(28, 26, 23, 0.2);
  }
  #settingsSheet::before {
    content: "";
    position: absolute;
    top: 9px;
    left: 50%;
    width: 40px;
    height: 4px;
    margin-left: -20px;
    border-radius: 2px;
    background: var(--paper-dim);
  }
  #settingsSheet.open { transform: translateY(0); visibility: visible; transition-delay: 0s; }

  #settingsSheet h2 {
    font-family: var(--font-read);
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 20px;
  }

  .field { margin-bottom: 22px; }
  .field label { display: block; font-size: 0.85rem; font-weight: 550; color: var(--ink-soft); margin-bottom: 8px; }

  select {
    width: 100%;
    padding: 13px 40px 13px 14px;
    font-family: inherit;
    font-size: 0.95rem;
    border: 1px solid var(--line);
    border-radius: 14px;
    background-color: var(--paper);
    color: var(--ink);
    appearance: none;
    -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%);
    background-position: calc(100% - 22px) center, calc(100% - 17px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    cursor: pointer;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  select:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 4px rgba(176, 138, 62, 0.22); }

  .speed-row { display: flex; align-items: center; gap: 14px; }
  input[type=range] {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 6px; background: var(--gold-soft); border-radius: 3px; outline: none;
  }
  input[type=range]::-moz-range-track { height: 6px; background: var(--gold-soft); border-radius: 3px; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%;
    background: var(--gold); border: 4px solid var(--surface); cursor: pointer;
    box-shadow: 0 0 0 1px var(--gold), 0 2px 8px rgba(28, 26, 23, 0.3);
  }
  input[type=range]::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--gold); border: 4px solid var(--surface); cursor: pointer;
    box-shadow: 0 0 0 1px var(--gold), 0 2px 8px rgba(28, 26, 23, 0.3);
  }
  input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 1px var(--gold), 0 0 0 6px rgba(176, 138, 62, 0.3); }
  .speed-value {
    min-width: 52px; text-align: center;
    padding: 6px 0; border-radius: 999px; background: var(--paper);
    color: var(--ink); font-size: 0.88rem; font-weight: 600; font-variant-numeric: tabular-nums;
  }

  #closeSettings {
    width: 100%; padding: 15px; margin-top: 2px;
    border: none; border-radius: 14px;
    background: var(--ink); color: var(--paper);
    font-size: 0.98rem; font-weight: 600; cursor: pointer;
    transition: transform 0.12s var(--ease), background 0.15s ease;
  }
  #closeSettings:hover { background: #2E2A25; }
  #closeSettings:active { transform: scale(0.98); }

  details { margin-top: 16px; }
  summary { cursor: pointer; font-size: 0.8rem; color: var(--ink-soft); list-style: none; text-align: center; }
  summary::-webkit-details-marker { display: none; }
  summary:hover { color: var(--ink); }
  #diag {
    font-size: 0.78rem; color: var(--ink-soft); white-space: pre-wrap; margin-top: 8px; line-height: 1.5;
    padding: 10px 12px; background: var(--paper); border-radius: 10px;
  }

  #scrim {
    position: fixed; inset: 0; background: rgba(28, 26, 23, 0.38);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease; z-index: 9;
  }
  #scrim.open { opacity: 1; pointer-events: auto; }
  #toast {
    position: fixed; left: 16px; right: 16px; bottom: max(16px, env(safe-area-inset-bottom));
    z-index: 20; padding: 12px 16px; border-radius: 14px;
    background: var(--red-deep); color: #fff; font-size: 0.88rem; line-height: 1.4;
    box-shadow: var(--shadow-float); opacity: 0; transform: translateY(8px);
    pointer-events: none; transition: opacity 0.2s ease, transform 0.2s var(--ease);
  }
  #toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>
<div id="app">

  <!-- SETUP VIEW -->
  <div class="view active" id="setup">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="9" width="3.4" height="6" rx="1.7"/><rect x="8.2" y="5" width="3.4" height="14" rx="1.7"/><rect x="13.4" y="7.5" width="3.4" height="9" rx="1.7"/><rect x="18.6" y="10.5" width="3.4" height="3" rx="1.5"/></svg>
      </span>
      <h1>Reader</h1>
    </div>
    <p class="sub">Load a note and listen to it, sentence by sentence.</p>

    <div class="dropzone" id="dropzone">
      <span class="dropzone-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
      </span>
      <span>Drop a <strong>.md</strong> or <strong>.txt</strong> file here, or tap to choose one</span>
    </div>
    <input type="file" id="fileInput">

    <textarea id="pasteText" placeholder="...or paste your note text here"></textarea>

    <button id="startBtn" disabled>Start reading</button>
    <div id="setupNote"></div>
  </div>

  <!-- PLAYER VIEW -->
  <div class="view" id="player">
    <div id="playerTopbar">
      <button id="backBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        Back
      </button>
      <div id="docTitle">Untitled</div>
      <button id="settingsBtn" title="Voice &amp; speed" aria-label="Voice and speed settings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"/><circle cx="16" cy="7" r="2.4"/><circle cx="10" cy="17" r="2.4"/></svg>
      </button>
    </div>

    <div id="sentences"></div>

    <div id="transportBar">
      <div id="scrubPreview" aria-hidden="true"><span class="scrub-count"></span><span class="scrub-text"></span></div>
      <div id="progressWrap">
        <div id="progressTrack"><div id="progressFill"></div></div>
        <div id="progressMeta">
          <span id="progressCount">0 / 0</span>
          <span id="progressEta">&nbsp;</span>
        </div>
      </div>
      <div class="transport">
        <button class="icon-btn" id="prevBtn" title="Previous sentence" aria-label="Previous sentence">
          <svg width="24" height="24" viewBox="0 0 24 24"><path d="M18 6v12M6 12l10-7v14z" fill="currentColor"/></svg>
        </button>
        <button class="play-btn" id="playBtn" title="Play" aria-label="Play or pause">
          <svg id="playIcon" width="28" height="28" viewBox="0 0 24 24"><path d="M7 5v14l12-7z" fill="currentColor"/></svg>
        </button>
        <button class="icon-btn" id="nextBtn" title="Next sentence" aria-label="Next sentence">
          <svg width="24" height="24" viewBox="0 0 24 24"><path d="M6 6v12M18 12L8 5v14z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  </div>

</div>

<div id="scrim"></div>
<div id="toast" role="status"></div>
<div id="settingsSheet">
  <h2>Voice &amp; speed</h2>
  <div class="field">
    <label for="voiceSel">Voice</label>
    <select id="voiceSel"></select>
  </div>
  <div class="field">
    <label for="speedRange">Speed</label>
    <div class="speed-row">
      <input type="range" id="speedRange" min="0.5" max="2" step="0.05" value="1">
      <span class="speed-value" id="speedLabel">1.0x</span>
    </div>
  </div>
  <div class="field">
    <label for="sizeRange">Text size</label>
    <div class="speed-row">
      <input type="range" id="sizeRange" min="0.9" max="2" step="0.05" value="1.2">
      <span class="speed-value" id="sizeLabel">1.20</span>
    </div>
  </div>
  <div class="field">
    <label for="lhRange">Line spacing</label>
    <div class="speed-row">
      <input type="range" id="lhRange" min="1.3" max="2.4" step="0.05" value="1.8">
      <span class="speed-value" id="lhLabel">1.80</span>
    </div>
  </div>
  <button id="closeSettings">Done</button>
  <details>
    <summary>Status</summary>
    <div id="diag"></div>
  </details>
</div>

<script>
const synth = window.speechSynthesis || null;
// Inside the Android app (Capacitor) the WebView has no usable speechSynthesis,
// so we talk to the phone's native text-to-speech plugin instead.
// (tts.js, bundled in only by the APK build, sets window.__TTS; it never throws here.)
const NativeTTS = (function () { try { return window.__TTS || null; } catch (e) { return null; } })();
const hasSpeech = !!(NativeTTS || synth);
let nativeVoices = [];
let speakToken = 0;   // bumps on every cancel so stale 'finished' callbacks are ignored

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 6000);
}

function cancelSpeech() {
  speakToken++;
  if (NativeTTS) { NativeTTS.stop().catch(() => {}); }
  else if (synth) { synth.cancel(); }
}

// ---- elements ----
const setupView = document.getElementById('setup');
const playerView = document.getElementById('player');
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const pasteText = document.getElementById('pasteText');
const startBtn = document.getElementById('startBtn');
const setupNote = document.getElementById('setupNote');

const backBtn = document.getElementById('backBtn');
const docTitle = document.getElementById('docTitle');
const settingsBtn = document.getElementById('settingsBtn');
const sentencesEl = document.getElementById('sentences');

const progressFill = document.getElementById('progressFill');
const progressTrack = document.getElementById('progressTrack');
const progressWrap = document.getElementById('progressWrap');
const progressCount = document.getElementById('progressCount');
const progressEta = document.getElementById('progressEta');

const prevBtn = document.getElementById('prevBtn');
const playBtn = document.getElementById('playBtn');
const nextBtn = document.getElementById('nextBtn');

const scrim = document.getElementById('scrim');
const settingsSheet = document.getElementById('settingsSheet');
const voiceSel = document.getElementById('voiceSel');
const speedRange = document.getElementById('speedRange');
const speedLabel = document.getElementById('speedLabel');
const closeSettings = document.getElementById('closeSettings');
const sizeRange = document.getElementById('sizeRange');
const sizeLabel = document.getElementById('sizeLabel');
const lhRange = document.getElementById('lhRange');
const lhLabel = document.getElementById('lhLabel');
const diag = document.getElementById('diag');

const ICON_PLAY = '<path d="M7 5v14l12-7z" fill="currentColor"/>';
const ICON_PAUSE = '<rect x="6" y="5" width="4" height="14" fill="currentColor"/><rect x="14" y="5" width="4" height="14" fill="currentColor"/>';

// ---- state ----
let sentences = [];   // { text, el }
let idx = 0;
let playing = false;  // true = we intend continuous playback / auto-advance

// ---- helpers ----
function stripMarkdown(s) {
  return s
    .replace(/```[\s\S]*?```/g, '')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/==(?=\S)([^=\n]*?\S)==/g, '$1')   // ==highlight== -> highlight
    .replace(/!\[.*?\]\(.*?\)/g, '')
    .replace(/\[([^\]]+)\]\(.*?\)/g, '$1')
    .replace(/^#{1,6}\s+/gm, '')
    .replace(/[*_~>]/g, '')
    .trim();
}

/**
 * splitSentences(text)
 *
 * Splits text into an array of sentences — built for feeding a
 * text-to-speech / "read aloud" pipeline one sentence at a time.
 *
 * KEY DESIGN CHANGE from a fragment-matching regex:
 * Instead of using String.match() to pull sentence-shaped fragments out
 * (which can silently SKIP a character position if no alternative matches
 * there — this is very likely what caused your "disappearing sentence"
 * bug), this version finds each sentence-boundary position with a regex,
 * then SLICES the original string between boundaries. Slicing guarantees
 * every character in the input ends up in the output somewhere — text
 * cannot vanish, it can only end up in the wrong place.
 *
 * Protected from being mistaken for a sentence end:
 *  - Common abbreviations (Mr., Dr., vs., etc., e.g., i.e., a.m./p.m., U.S., U.K., ...)
 *  - Initials (J.K. Rowling, A. Smith)
 *  - Decimals, version numbers, times, IPs (3.14, v2.0.1, 10.30, 192.168.0.1)
 *  - URLs and emails (including query strings / paths with . ? ! in them)
 *  - Bare domains (example.com, site.co.uk, mysite.ng)
 *  - Markdown links/images ([label](url "title")), inline code `like.this()`,
 *    and fenced ``` code blocks ```
 *  - Numbered-list markers at the start of a line ("1. Item")
 *
 * Also normalizes missing whitespace after real terminal punctuation
 * ("end.Next" -> "end. Next") so typo run-ons don't merge two sentences.
 *
 * Known limitations (inherent to any regex-based splitter, not just this one):
 *  - A single capital letter that legitimately ends a sentence right before
 *    another capitalized word ("Turn left at Point A. Then continue.") can
 *    be mistaken for an initial and left unsplit. True disambiguation needs
 *    an NLP sentence tokenizer, not regex.
 *  - Nested dialogue with multiple sentences inside one quote
 *    (`He said, "Wait. Stop. Now."`) will still split at each internal
 *    period — this mirrors the original behavior and is a design choice,
 *    not a bug; merge them yourself downstream if you want the whole quote
 *    read as one unit.
 */
function splitSentences(text) {
  if (!text || typeof text !== 'string') return [];

  // Placeholders that contain none of . ! ? so they're invisible to the
  // boundary regex below. Restored to real punctuation at the very end.
  const maskPunct = (s) =>
    s.replace(/\./g, '\u0001').replace(/\?/g, '\u0002').replace(/!/g, '\u0003');
  const unmaskPunct = (s) =>
    s.replace(/\u0001/g, '.').replace(/\u0002/g, '?').replace(/\u0003/g, '!');

  // For URL-like matches: strip trailing punctuation FIRST so a real
  // sentence-ending character right after the URL still works, then mask
  // only the "core" of the match.
  const maskCoreKeepTrail = (match) => {
    const trailMatch = match.match(/[.,!?;:'"”’)\]]+$/);
    const trail = trailMatch ? trailMatch[0] : '';
    const core = trail ? match.slice(0, -trail.length) : match;
    return maskPunct(core) + trail;
  };

  let t = text;

  // --- Markdown-specific protection (safe to leave in even for plain text) ---
  t = t.replace(/```[\s\S]*?```/g, (m) => maskPunct(m));           // fenced code blocks
  t = t.replace(/`[^`\n]+`/g, (m) => maskPunct(m));                // inline code
  t = t.replace(/\]\(([^)]+)\)/g, (m, inner) => `](${maskPunct(inner)})`); // link/image target

  // --- URLs, emails, domains (handles query strings, so a "?" in a URL
  //     is no longer mistaken for a sentence end) ---
  t = t.replace(/\b(?:https?:\/\/|www\.)\S+/gi, maskCoreKeepTrail);
  t = t.replace(/\b[\w.+-]+@[\w-]+\.[\w.-]+\b/g, (m) => maskPunct(m));
  t = t.replace(
    /\b[a-z0-9-]+(?:\.[a-z0-9-]+)*\.(?:com|net|org|io|co|ng|gov|edu|info|biz|ai|dev|app|xyz|co\.uk|co\.ng|org\.ng|gov\.ng)(?:\/\S*)?\b/gi,
    maskCoreKeepTrail
  );

  // --- Decimals, version numbers, times, IPs ---
  t = t.replace(/\b\d+(?:\.\d+)+\b/g, (m) => maskPunct(m));

  // --- Abbreviations that already contain internal periods (longest first,
  //     so "U.S.A." isn't cut short by a "U.S." match) ---
  const dottedAbbrevs = [
    'U\\.S\\.A\\.', 'U\\.S\\.', 'U\\.K\\.', 'U\\.N\\.',
    'e\\.g\\.', 'i\\.e\\.', 'cf\\.', 'viz\\.',
    'a\\.m\\.', 'p\\.m\\.', 'A\\.M\\.', 'P\\.M\\.',
  ];
  t = t.replace(new RegExp('\\b(?:' + dottedAbbrevs.join('|') + ')', 'g'), (m) => maskPunct(m));

  // --- Abbreviations with a single trailing period ---
  const simpleAbbrevs = [
    'Mr','Mrs','Ms','Mx','Dr','Prof','Sr','Jr','St','Rev','Gen','Sgt','Col','Lt','Capt','Fr','Hon',
    'vs','etc','approx','dept','univ','al',
    'Jan','Feb','Mar','Apr','Jun','Jul','Aug','Sep','Sept','Oct','Nov','Dec',
    'Mon','Tue','Tues','Wed','Thu','Thur','Thurs','Fri','Sat','Sun',
    'Vol','pp','fig','Fig','ch','Ch','sec','Sec','para','Para',
  ];
  t = t.replace(new RegExp('\\b(' + simpleAbbrevs.join('|') + ')\\.', 'g'), (m) => maskPunct(m));

  // --- Initials: "J.K. Rowling", "A. Smith" ---
  t = t.replace(/\b([A-Z])\.(?=[A-Z]\.)/g, (m) => maskPunct(m));      // first of a run: "J."
  t = t.replace(/\b([A-Z])\.(?=\s[A-Z][a-z])/g, (m) => maskPunct(m)); // last before a name: "K." / "A."

  // --- Numbered-list markers at the start of a line: "1. Item" ---
  t = t.replace(/^(\s*\d+)\.(?=\s+\S)/gm, (m) => maskPunct(m));

  // --- Fix missing whitespace after a REAL terminal punctuation mark, so
  //     typo run-ons don't merge two sentences into one ("end.Next" -> "end. Next") ---
  t = t.replace(/([.!?])(["'”’»)\]]*)([A-Z])/g, (m, p1, quote, cap) => `${p1}${quote} ${cap}`);

  // --- Split into paragraphs, then slice each into sentences by boundary ---
  const paragraphs = t.split(/\n+/).map((p) => p.trim()).filter(Boolean);
  const out = [];
  const boundaryRe = /[.!?]+(?:["'”’»)\]]*)?(?=\s|$)/g;

  paragraphs.forEach((para) => {
    let start = 0;
    let m;
    boundaryRe.lastIndex = 0;
    while ((m = boundaryRe.exec(para)) !== null) {
      const end = m.index + m[0].length;
      const sentence = unmaskPunct(para.slice(start, end)).trim();
      if (sentence) out.push(sentence);
      start = end;
    }
    // Anything left over (no terminal punctuation at all) is still captured
    // here — this is what guarantees no text can silently disappear.
    const rest = unmaskPunct(para.slice(start)).trim();
    if (rest) out.push(rest);
  });

  return out;
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { splitSentences };
}


function wordCount(s) { return (s.match(/\S+/g) || []).length; }

// ---- voices ----
function populateVoices() {
  if (!hasSpeech) { reportDiag(); return; }
  const voices = NativeTTS ? nativeVoices : synth.getVoices();
  const current = voiceSel.value;
  voiceSel.innerHTML = '';
  const def = document.createElement('option');
  def.value = ''; def.textContent = 'System default';
  voiceSel.appendChild(def);
  voices.forEach((v, i) => {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = `${v.name} (${v.lang})`;
    voiceSel.appendChild(o);
  });
  if (current) voiceSel.value = current;
  reportDiag();
}

function reportDiag() {
  const voices = NativeTTS ? nativeVoices : (synth ? synth.getVoices() : []);
  const engine = NativeTTS ? 'native (Android)' : (synth ? 'browser' : 'missing');
  diag.textContent = `speech engine: ${engine}\nvoices reported: ${voices.length}`;
}

if (NativeTTS) {
  // The phone's engine can still be starting up, or may not list voices at all
  // (it then reports null). Retry a few times, then carry on with the default voice.
  const loadNativeVoices = (attempt) => {
    NativeTTS.getSupportedVoices()
      .then((r) => {
        nativeVoices = (r && r.voices) || [];
        populateVoices();
        setupNote.textContent = nativeVoices.length
          ? `Voice engine: phone speech · ${nativeVoices.length} voices found`
          : 'Voice engine: phone speech · default voice';
      })
      .catch(() => {
        if (attempt < 4) { setTimeout(() => loadNativeVoices(attempt + 1), 800); return; }
        nativeVoices = [];
        populateVoices();
        setupNote.textContent = 'Voice engine: phone speech · default voice (no voice list)';
      });
  };
  loadNativeVoices(0);
} else if (synth) {
  synth.getVoices();
  synth.addEventListener('voiceschanged', populateVoices);
} else {
  setupNote.textContent = 'This browser has no built-in speech engine — try opening this file in Chrome.';
}
populateVoices();

speedRange.addEventListener('input', () => { speedLabel.textContent = parseFloat(speedRange.value).toFixed(2) + 'x'; });

// ---- setup view: loading text ----
function setSourceText(raw, label) {
  const cleaned = stripMarkdown(raw);
  pasteText.value = cleaned;
  startBtn.disabled = !cleaned.trim();
  setupNote.textContent = cleaned.trim() ? `Loaded ${wordCount(cleaned)} words${label ? ' from ' + label : ''}.` : '';
}

pasteText.addEventListener('input', () => {
  startBtn.disabled = !pasteText.value.trim();
});

dropzone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => loadFile(e.target.files[0]));
['dragenter', 'dragover'].forEach(evt => dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add('dragover'); }));
['dragleave', 'drop'].forEach(evt => dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove('dragover'); }));
dropzone.addEventListener('drop', (e) => loadFile(e.dataTransfer.files[0]));

let loadedName = 'Untitled';
function loadFile(f) {
  if (!f) return;
  loadedName = f.name;
  const r = new FileReader();
  r.onload = () => setSourceText(r.result, f.name);
  r.onerror = () => { setupNote.textContent = 'Could not read that file. Try pasting the text instead.'; };
  r.readAsText(f);
}

startBtn.addEventListener('click', () => {
  const text = stripMarkdown(pasteText.value);
  if (!text.trim()) return;
  buildPlayer(text);
});

// ---- building the player ----
function buildPlayer(text) {
  const raw = splitSentences(text);
  sentences = raw.map(t => ({ text: t, el: null }));
  idx = 0;
  playing = false;

  sentencesEl.innerHTML = '';
  sentences.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'sentence';
    div.textContent = s.text;
    div.addEventListener('click', () => jumpTo(i, true));
    sentencesEl.appendChild(div);
    s.el = div;
  });

  docTitle.textContent = loadedName !== 'Untitled' ? loadedName : `${sentences.length} sentences`;
  updateHighlight();
  updateProgress();
  setPlayingUI(false);

  setupView.classList.remove('active');
  playerView.classList.add('active');
}

backBtn.addEventListener('click', () => {
  stopPlayback();
  playerView.classList.remove('active');
  setupView.classList.add('active');
});

// ---- playback core (sentence-queue, never relies on native pause/resume) ----
function speakSentence(i) {
  if (!hasSpeech) return;
  if (i < 0) i = 0;
  if (i >= sentences.length) { playing = false; setPlayingUI(false); return; }
  idx = i;
  updateHighlight();
  updateProgress();

  if (NativeTTS) {
    const token = ++speakToken;
    const opts = { text: sentences[i].text, rate: parseFloat(speedRange.value), lang: 'en-US' };
    const vIdx = voiceSel.value;
    if (vIdx !== '' && nativeVoices[vIdx]) { opts.voice = Number(vIdx); opts.lang = nativeVoices[vIdx].lang || opts.lang; }
    NativeTTS.speak(opts)
      .then(() => { if (token === speakToken && playing) speakSentence(idx + 1); })
      .catch((err) => {
        if (token !== speakToken) return;
        playing = false; setPlayingUI(false);
        showToast('Speech error: ' + ((err && err.message) || err));
      });
    return;
  }

  synth.cancel();
  const u = new SpeechSynthesisUtterance(sentences[i].text);
  u.rate = parseFloat(speedRange.value);
  const vIdx = voiceSel.value;
  if (vIdx !== '') u.voice = synth.getVoices()[vIdx];

  u.onend = () => { if (playing) speakSentence(idx + 1); };
  u.onerror = () => { setPlayingUI(false); };
  synth.speak(u);
}

function play() {
  if (!hasSpeech) { setupNote.textContent = 'No speech engine available.'; return; }
  playing = true;
  setPlayingUI(true);
  speakSentence(idx);
}

function pausePlayback() {
  playing = false;
  cancelSpeech(); // cancel, don't rely on the unreliable native pause()
  setPlayingUI(false);
}

function stopPlayback() {
  playing = false;
  cancelSpeech();
  idx = 0;
  setPlayingUI(false);
}

function jumpTo(i, autoplay) {
  idx = Math.max(0, Math.min(sentences.length - 1, i));
  if (autoplay) { playing = true; setPlayingUI(true); speakSentence(idx); }
  else { cancelSpeech(); updateHighlight(); updateProgress(); }
}

playBtn.addEventListener('click', () => { playing ? pausePlayback() : play(); });
prevBtn.addEventListener('click', () => jumpTo(idx - 1, playing));
nextBtn.addEventListener('click', () => jumpTo(idx + 1, playing));

// ---- drag to scrub (tap still jumps) ----
const scrubPreview = document.getElementById('scrubPreview');
let scrubbing = false;
let resumeAfterScrub = false;

function scrubTo(clientX) {
  if (!sentences.length) return;
  const rect = progressTrack.getBoundingClientRect();
  const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
  const i = Math.round(ratio * (sentences.length - 1));
  if (i !== idx) {
    idx = i;
    updateHighlight(true);
    updateProgress();
  }
  scrubPreview.querySelector('.scrub-count').textContent = `${idx + 1} / ${sentences.length}`;
  scrubPreview.querySelector('.scrub-text').textContent = sentences[idx].text;
}

progressWrap.addEventListener('pointerdown', (e) => {
  if (!sentences.length || (e.pointerType === 'mouse' && e.button !== 0)) return;
  scrubbing = true;
  resumeAfterScrub = playing;
  playing = false;                 // stop auto-advance while the finger is down
  cancelSpeech();
  progressWrap.setPointerCapture(e.pointerId);
  progressWrap.classList.add('scrubbing');
  scrubPreview.classList.add('show');
  scrubTo(e.clientX);
});

progressWrap.addEventListener('pointermove', (e) => { if (scrubbing) scrubTo(e.clientX); });

function endScrub(e, commit) {
  if (!scrubbing) return;
  scrubbing = false;
  progressWrap.classList.remove('scrubbing');
  scrubPreview.classList.remove('show');
  if (commit) scrubTo(e.clientX);
  if (resumeAfterScrub) { playing = true; speakSentence(idx); }
  resumeAfterScrub = false;
}
progressWrap.addEventListener('pointerup', (e) => endScrub(e, true));
progressWrap.addEventListener('pointercancel', (e) => endScrub(e, false));

// ---- UI updates ----
function setPlayingUI(isPlaying) {
  const iconSvg = playBtn.querySelector('svg');
  if (iconSvg) {
    iconSvg.innerHTML = isPlaying ? ICON_PAUSE : ICON_PLAY;
  }
}

function updateHighlight(instant) {
  sentences.forEach((s, i) => s.el.classList.toggle('current', i === idx));
  const cur = sentences[idx];
  if (cur) cur.el.scrollIntoView({ block: 'center', behavior: instant ? 'auto' : 'smooth' });
}

function updateProgress() {
  const total = sentences.length || 1;
  progressFill.style.width = `${(idx / Math.max(1, total - 1)) * 100}%`;
  progressCount.textContent = `${Math.min(idx + 1, total)} / ${total}`;

  const wordsTotal = sentences.reduce((n, s) => n + wordCount(s.text), 0);
  const wordsDone = sentences.slice(0, idx).reduce((n, s) => n + wordCount(s.text), 0);
  const wordsLeft = Math.max(0, wordsTotal - wordsDone);
  const speed = parseFloat(speedRange.value) || 1;
  const minsLeft = wordsLeft / (155 * speed);
  progressEta.textContent = minsLeft < 1 ? '< 1 min left' : `~${Math.round(minsLeft)} min left`;
}

// ---- settings sheet ----
function openSettings() { settingsSheet.classList.add('open'); scrim.classList.add('open'); }
function closeSettingsSheet() { settingsSheet.classList.remove('open'); scrim.classList.remove('open'); }
settingsBtn.addEventListener('click', openSettings);
closeSettings.addEventListener('click', closeSettingsSheet);
scrim.addEventListener('click', closeSettingsSheet);

speedRange.addEventListener('change', () => { if (playing) speakSentence(idx); else updateProgress(); });
voiceSel.addEventListener('change', () => { if (playing) speakSentence(idx); });

// ---- text size & line spacing ----
function applyTextPrefs(save) {
  const size = parseFloat(sizeRange.value);
  const lh = parseFloat(lhRange.value);
  sentencesEl.style.setProperty('--read-size', size + 'rem');
  sentencesEl.style.setProperty('--read-lh', lh);
  sizeLabel.textContent = size.toFixed(2);
  lhLabel.textContent = lh.toFixed(2);
  if (save) {
    try { localStorage.setItem('reader.textPrefs', JSON.stringify({ size, lh })); } catch (e) {}
    const cur = sentences[idx];
    if (cur && cur.el) cur.el.scrollIntoView({ block: 'center' });
  }
}
try {
  const saved = JSON.parse(localStorage.getItem('reader.textPrefs') || 'null');
  if (saved) { sizeRange.value = saved.size; lhRange.value = saved.lh; }
} catch (e) {}
sizeRange.addEventListener('input', () => applyTextPrefs(true));
lhRange.addEventListener('input', () => applyTextPrefs(true));
applyTextPrefs(false);
</script>
