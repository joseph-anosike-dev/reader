<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F4F0E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Reader</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- SETUP VIEW -->
  <div class="view active" id="setup">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="9" width="3.4" height="6" rx="1.7"/><rect x="8.2" y="5" width="3.4" height="14" rx="1.7"/><rect x="13.4" y="7.5" width="3.4" height="9" rx="1.7"/><rect x="18.6" y="10.5" width="3.4" height="3" rx="1.5"/></svg>
      </span>
      <h1>Reader</h1>
    </div>
    <p class="sub">Load a note and listen to it, sentence by sentence.</p>

    <section id="recent" hidden>
      <div class="recent-head"><h2>Recent</h2><button id="recentToggle" type="button"></button></div>
      <ul id="recentList"></ul>
    </section>

    <button type="button" class="add-file" id="dropzone">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span class="add-file-text"><strong>Add a file</strong><small>md · txt · pdf · docx · pptx</small></span>
    </button>
    <input type="file" id="fileInput">

    <textarea id="pasteText" placeholder="...or paste your note text here"></textarea>

    <button id="startBtn" disabled>Start reading</button>
    <div id="setupNote"></div>
  </div>

  <!-- PLAYER VIEW -->
  <div class="view" id="player">
    <div id="playerTopbar">
      <button id="backBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        Back
      </button>
      <div id="docTitle">Untitled</div>
      <button id="sectionsBtn" title="Jump to section" aria-label="Jump to section" hidden>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.6" cy="6" r="1.1" fill="currentColor"/><circle cx="4.6" cy="12" r="1.1" fill="currentColor"/><circle cx="4.6" cy="18" r="1.1" fill="currentColor"/></svg>
      </button>
      <button id="settingsBtn" title="Voice &amp; text" aria-label="Voice and text settings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"/><circle cx="16" cy="7" r="2.4"/><circle cx="10" cy="17" r="2.4"/></svg>
      </button>
    </div>

    <div id="sentences"></div>

    <div id="transportBar">
      <div id="scrubPreview" aria-hidden="true"><span class="scrub-count"></span><span class="scrub-text"></span></div>
      <div id="progressWrap">
        <div id="progressTrack"><div id="progressFill"></div></div>
        <div id="progressMeta">
          <span id="progressCount">0 / 0</span>
          <span id="progressEta">&nbsp;</span>
        </div>
      </div>
      <div class="transport">
        <button class="icon-btn small toggle" id="repeatBtn" title="Repeat the whole file" aria-label="Repeat the whole file" aria-pressed="false">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>
        </button>
        <button class="icon-btn" id="prevBtn" title="Previous sentence" aria-label="Previous sentence">
          <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="3" height="14" rx="1.2" fill="currentColor"/><path d="M20 6v12L9.5 12z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </button>
        <button class="play-btn" id="playBtn" title="Play" aria-label="Play or pause">
          <svg id="playIcon" width="28" height="28" viewBox="0 0 24 24"><path d="M7 5v14l12-7z" fill="currentColor"/></svg>
        </button>
        <button class="icon-btn" id="nextBtn" title="Next sentence" aria-label="Next sentence">
          <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6v12l10.5-6z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><rect x="17" y="5" width="3" height="14" rx="1.2" fill="currentColor"/></svg>
        </button>
        <button class="icon-btn small toggle" id="abBtn" title="A-B loop: tap to set the start, tap again to set the end, tap again to clear" aria-label="A-B loop" aria-pressed="false">
          <span class="ab-text" id="abText">A-B</span>
        </button>
      </div>
      <div class="slider-row">
        <span class="slider-ico" title="Volume"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.6 6.4a8 8 0 0 1 0 11.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
        <input type="range" id="volumeRange" min="0" max="100" step="1" value="100" aria-label="Volume">
        <span class="slider-val" id="volumeLabel">100%</span>
      </div>
      <div class="slider-row">
        <span class="slider-ico" title="Speed"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6v12l9-6zM12 6v12l9-6z" fill="currentColor"/></svg></span>
        <input type="range" id="speedRange" min="0.5" max="2" step="0.05" value="1" aria-label="Reading speed">
        <span class="slider-val" id="speedLabel">1.00x</span>
      </div>
    </div>
  </div>

</div>

<div id="scrim"></div>
<div id="toast" role="status"></div>
<div id="settingsSheet" class="sheet">
  <h2>Voice &amp; text</h2>
  <div class="field">
    <label for="voiceSel">Voice</label>
    <select id="voiceSel"></select>
  </div>
  <div class="field">
    <label for="sizeRange">Text size</label>
    <div class="speed-row">
      <input type="range" id="sizeRange" min="0.9" max="2" step="0.05" value="1.2">
      <span class="speed-value" id="sizeLabel">1.20</span>
    </div>
  </div>
  <div class="field">
    <label for="lhRange">Line spacing</label>
    <div class="speed-row">
      <input type="range" id="lhRange" min="1.3" max="2.4" step="0.05" value="1.8">
      <span class="speed-value" id="lhLabel">1.80</span>
    </div>
  </div>
  <button id="closeSettings">Done</button>
  <details>
    <summary>Status</summary>
    <div id="diag"></div>
  </details>
</div>

<div id="sectionsSheet" class="sheet">
  <h2>Jump to section</h2>
  <div class="sheet-scroll" id="sectionsList"></div>
  <button class="sheet-done" id="closeSections" data-close-sheet>Done</button>
</div>

<div id="recentSheet" class="sheet">
  <h2>Recent</h2>
  <div class="sheet-scroll"><ul id="recentAllList"></ul></div>
  <button class="sheet-done" id="closeRecent" data-close-sheet>Done</button>
</div>

<script src="app.js"></script>
</body>
</html>
