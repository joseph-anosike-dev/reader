name: Build APK
on:
  push:
    paths:
      - '*.html'
      - '*.css'
      - 'app.js'
      - 'docs-entry.js'
      - 'assets/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install packages
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor-community/text-to-speech@6 @capacitor/assets@3 esbuild pdfjs-dist@4.10.38 mammoth@1.8.0 jszip@3.10.1
      - name: Prepare web files (bundle speech and document readers)
        run: |
          mkdir -p www
          cp "$(ls *.html | head -n1)" www/index.html
          # the page's own stylesheet and script (everything else is bundled below)
          for f in style.css app.js; do
            if [ ! -f "$f" ]; then echo "ERROR: $f is missing from the repo"; exit 1; fi
            cp "$f" www/
          done
          cat > tts-entry.js <<'JS'
          import { Capacitor, registerPlugin } from '@capacitor/core';
          import { TextToSpeech } from '@capacitor-community/text-to-speech';
          window.__TTS = Capacitor.isNativePlatform() ? TextToSpeech : null;
          window.__VOL = Capacitor.isNativePlatform() ? registerPlugin('SystemVolume') : null;
          window.__BG = Capacitor.isNativePlatform() ? registerPlugin('ReaderPlayback') : null;
          JS
          npx esbuild tts-entry.js --bundle --format=iife --minify --outfile=www/tts.js
          SCRIPTS='<script src="tts.js"></script>'
          if [ -f docs-entry.js ]; then
            npx esbuild docs-entry.js --bundle --format=iife --minify --outfile=www/docs.js
            SCRIPTS="$SCRIPTS"$'\n''<script src="docs.js"></script>'
          else
            echo "docs-entry.js not found: PDF, Word and PowerPoint reading will be skipped"
          fi
          SCRIPTS="$SCRIPTS" python3 - <<'PY'
          import os
          p = 'www/index.html'
          s = open(p, encoding='utf-8').read()
          marker = '<script src="app.js"></script>'
          assert marker in s, 'index.html must contain ' + marker
          s = s.replace(marker, os.environ['SCRIPTS'] + '\n' + marker, 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
      - name: Create Android project
        run: |
          npx cap init Reader com.reader.app --web-dir=www
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Add system volume plugin
        run: |
          DIR=android/app/src/main/java/com/reader/app
          cat > $DIR/SystemVolumePlugin.java <<'JAVA'
          package com.reader.app;

          import android.content.Context;
          import android.media.AudioManager;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          // Reads and sets the phone's real media volume (the one the volume buttons change).
          @CapacitorPlugin(name = "SystemVolume")
          public class SystemVolumePlugin extends Plugin {
              private AudioManager audio() {
                  return (AudioManager) getContext().getSystemService(Context.AUDIO_SERVICE);
              }

              @PluginMethod
              public void getVolume(PluginCall call) {
                  AudioManager am = audio();
                  JSObject ret = new JSObject();
                  ret.put("level", am.getStreamVolume(AudioManager.STREAM_MUSIC));
                  ret.put("max", am.getStreamMaxVolume(AudioManager.STREAM_MUSIC));
                  call.resolve(ret);
              }

              @PluginMethod
              public void setVolume(PluginCall call) {
                  Integer level = call.getInt("level");
                  if (level == null) { call.reject("level is required"); return; }
                  AudioManager am = audio();
                  int max = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC);
                  am.setStreamVolume(AudioManager.STREAM_MUSIC, Math.max(0, Math.min(max, level)), 0);
                  call.resolve();
              }
          }
          JAVA
          cat > $DIR/MainActivity.java <<'JAVA'
          package com.reader.app;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.media.AudioManager;
          import android.os.Build;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SystemVolumePlugin.class);
                  registerPlugin(ReaderPlaybackPlugin.class);
                  super.onCreate(savedInstanceState);
                  // hardware volume buttons control media volume while the app is open
                  setVolumeControlStream(AudioManager.STREAM_MUSIC);
                  // Android 13+: allow the playback notification (lock screen / notification shade controls)
                  if (Build.VERSION.SDK_INT >= 33
                          && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 7001);
                  }
              }
          }
          JAVA
          # background reading: foreground service + notification / lock screen controls
          cat > $DIR/ReaderPlaybackService.java <<'JAVA'
          package com.reader.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.ServiceInfo;
          import android.graphics.drawable.Icon;
          import android.media.AudioAttributes;
          import android.media.AudioFocusRequest;
          import android.media.AudioManager;
          import android.media.MediaMetadata;
          import android.media.session.MediaSession;
          import android.media.session.PlaybackState;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.speech.tts.Voice;
          import java.util.ArrayDeque;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;
          import java.util.Locale;

          // Reads the document aloud from a foreground service, so playback keeps going with the
          // screen off or the app minimized, and shows a media notification / lock screen controls.
          public class ReaderPlaybackService extends Service {

              public interface Listener {
                  void onSentence(int index, int gen);
                  void onState(boolean playing, int index, boolean ended);
                  void onError(String message);
              }

              static final String CHANNEL = "reader_playback";
              static final int NOTIF_ID = 4242;
              static final String A_PLAY = "com.reader.app.PLAY";
              static final String A_TOGGLE = "com.reader.app.TOGGLE";
              static final String A_NEXT = "com.reader.app.NEXT";
              static final String A_PREV = "com.reader.app.PREV";
              static final String A_STOP = "com.reader.app.STOP";

              // Shared with the Capacitor plugin (which fills these in before starting the service).
              static final List<String> sentences = Collections.synchronizedList(new ArrayList<String>());
              static volatile int index = 0;
              static volatile boolean playing = false;
              static volatile int gen = -1;          // -1 = last change came from the phone (notification, headset, ...)
              static volatile String title = "Reader";
              static volatile float rate = 1f;
              static volatile String voiceKey = "";
              static volatile String lang = "en-US";
              static volatile int loopA = -1;        // A-B loop (both -1 = off)
              static volatile int loopB = -1;
              static volatile boolean repeatAll = false;   // go back to the start after the last sentence
              static volatile Listener listener;
              static volatile ReaderPlaybackService instance;

              private Handler handler;
              private AudioManager audio;
              private NotificationManager nm;
              private MediaSession session;
              private TextToSpeech tts;
              private boolean ttsReady = false;
              private boolean pendingStart = false;
              private int token = 0;       // bumps on every flush so stale callbacks are ignored
              private int queuedTo = -1;   // last sentence handed to the speech engine
              private final ArrayDeque<Integer> queue = new ArrayDeque<Integer>();  // handed over, not yet started
              private boolean curStarted = false;
              private boolean resumeOnFocus = false;
              private boolean noisyRegistered = false;
              private String appliedVoice = null;
              private PowerManager.WakeLock wakeLock;
              private AudioFocusRequest focusReq;

              // ---------------- lifecycle ----------------
              @Override
              public void onCreate() {
                  super.onCreate();
                  instance = this;
                  handler = new Handler(Looper.getMainLooper());
                  audio = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                  nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel(CHANNEL, "Reading playback", NotificationManager.IMPORTANCE_LOW);
                      ch.setShowBadge(false);
                      ch.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                      nm.createNotificationChannel(ch);
                  }
                  session = new MediaSession(this, "Reader");
                  session.setCallback(new MediaSession.Callback() {
                      @Override public void onPlay() { userPlay(); }
                      @Override public void onPause() { userPause(); }
                      @Override public void onSkipToNext() { userJump(1); }
                      @Override public void onSkipToPrevious() { userJump(-1); }
                      @Override public void onStop() { userStop(); }
                  });
                  session.setActive(true);
                  tts = new TextToSpeech(getApplicationContext(), new TextToSpeech.OnInitListener() {
                      @Override public void onInit(final int status) {
                          handler.post(new Runnable() { @Override public void run() { onTtsInit(status); } });
                      }
                  });
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  startForegroundCompat();
                  String a = intent == null ? null : intent.getAction();
                  if (A_PLAY.equals(a)) userPlayFromJs();
                  else if (A_TOGGLE.equals(a)) { if (playing) userPause(); else userPlay(); }
                  else if (A_NEXT.equals(a)) userJump(1);
                  else if (A_PREV.equals(a)) userJump(-1);
                  else if (A_STOP.equals(a)) userStop();
                  return START_NOT_STICKY;
              }

              @Override public IBinder onBind(Intent intent) { return null; }

              @Override
              public void onTaskRemoved(Intent rootIntent) {   // app swiped away from recents
                  stopAll(true);
                  super.onTaskRemoved(rootIntent);
              }

              @Override
              public void onDestroy() {
                  releaseWake();
                  unregisterNoisy();
                  abandonFocus();
                  try { if (tts != null) { tts.stop(); tts.shutdown(); } } catch (Exception e) {}
                  try { if (session != null) { session.setActive(false); session.release(); } } catch (Exception e) {}
                  if (instance == this) instance = null;
                  playing = false;
                  super.onDestroy();
              }

              private void startForegroundCompat() {
                  Notification n = buildNotification();
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                  } else {
                      startForeground(NOTIF_ID, n);
                  }
              }

              // ---------------- speech engine ----------------
              private void onTtsInit(int status) {
                  if (status != TextToSpeech.SUCCESS) {
                      ttsReady = false;
                      playing = false;
                      Listener l = listener;
                      if (l != null) l.onError("Speech engine could not start");
                      refresh();
                      return;
                  }
                  ttsReady = true;
                  tts.setAudioAttributes(new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_MEDIA)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                          .build());
                  tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                      @Override public void onStart(final String id) {
                          handler.post(new Runnable() { @Override public void run() { utteranceStarted(id); } });
                      }
                      @Override public void onDone(final String id) {
                          handler.post(new Runnable() { @Override public void run() { utteranceDone(id); } });
                      }
                      @Override public void onError(final String id) {
                          handler.post(new Runnable() { @Override public void run() { utteranceError(id); } });
                      }
                  });
                  if (pendingStart) { pendingStart = false; speakFrom(index); }
              }

              private static String uid(int tok, int i) { return tok + "_" + i; }

              private int[] parseId(String id) {
                  try {
                      int u = id.indexOf('_');
                      return new int[]{Integer.parseInt(id.substring(0, u)), Integer.parseInt(id.substring(u + 1))};
                  } catch (Exception e) { return null; }
              }

              private String textAt(int i) {
                  try { return sentences.get(i); } catch (Exception e) { return ""; }
              }

              private void applyVoice() {
                  String key = voiceKey + "|" + lang;
                  if (key.equals(appliedVoice)) return;
                  appliedVoice = key;
                  try {
                      Voice found = null;
                      if (voiceKey != null && voiceKey.length() > 0) {
                          java.util.Set<Voice> all = tts.getVoices();
                          if (all != null) {
                              for (Voice v : all) {
                                  if (voiceKey.equals(v.getName())) { found = v; break; }
                              }
                          }
                      }
                      if (found != null) tts.setVoice(found);
                      else tts.setLanguage(Locale.forLanguageTag(lang == null || lang.length() == 0 ? "en-US" : lang));
                  } catch (Exception e) { /* keep the engine's default voice */ }
              }

              // Starts speaking at sentence i and keeps the next one queued, so there is no gap between sentences.
              private void speakFrom(int i) {
                  if (i < 0) i = 0;
                  if (i >= sentences.size()) { finishBook(); return; }
                  index = i;
                  playing = true;
                  if (!ttsReady) { pendingStart = true; refresh(); return; }
                  requestFocus();
                  acquireWake();
                  registerNoisy();
                  applyVoice();
                  tts.setSpeechRate(rate);
                  token++;
                  queue.clear();
                  curStarted = false;
                  queuedTo = i;
                  int r = tts.speak(textAt(i), TextToSpeech.QUEUE_FLUSH, null, uid(token, i));
                  if (r == TextToSpeech.SUCCESS) queue.add(i);
                  if (r != TextToSpeech.SUCCESS) {
                      // sentence the engine refused (e.g. too long): skip it
                      if (i + 1 < sentences.size()) { speakFrom(i + 1); return; }
                      finishBook();
                      return;
                  }
                  queueAhead();
                  refresh();
              }

              // Which sentence follows k: loops back at B (A-B loop), or at the end of the file (repeat). -1 = nothing.
              private int nextOf(int k) {
                  int a = loopA, b = loopB;
                  if (a >= 0 && b >= a && k == b) return a;
                  if (k + 1 < sentences.size()) return k + 1;
                  return repeatAll ? 0 : -1;
              }

              // Keeps exactly one sentence queued after the one being spoken, so there is no gap between sentences.
              private void queueAhead() {
                  if (!playing || !ttsReady) return;
                  int want = curStarted ? 1 : 2;
                  while (queue.size() < want) {
                      int n = nextOf(queuedTo);
                      if (n < 0) return;
                      int r = tts.speak(textAt(n), TextToSpeech.QUEUE_ADD, null, uid(token, n));
                      if (r != TextToSpeech.SUCCESS) return;
                      queue.add(n);
                      queuedTo = n;
                  }
              }

              private void utteranceStarted(String id) {
                  int[] p = parseId(id);
                  if (p == null || p[0] != token || !playing) return;
                  Integer front = queue.peekFirst();
                  if (front != null && front.intValue() == p[1]) queue.pollFirst();
                  curStarted = true;
                  index = p[1];
                  Listener l = listener;
                  if (l != null) l.onSentence(index, gen);
                  queueAhead();
                  refresh();
              }

              private void utteranceDone(String id) {
                  int[] p = parseId(id);
                  if (p == null || p[0] != token || !playing) return;
                  if (queue.isEmpty() && nextOf(p[1]) < 0) { finishBook(); return; }
                  queueAhead();
              }

              // The page changed the loop / repeat settings (main thread). If the sentence already queued
              // ahead is no longer the right one, restart the current sentence so the new setting applies.
              void loopChanged() {
                  if (!playing || !ttsReady || !curStarted) return;
                  Integer ahead = queue.peekFirst();
                  int want = nextOf(index);
                  boolean stale = (ahead == null) ? (want >= 0) : (ahead.intValue() != want);
                  if (stale) speakFrom(index);
              }

              private void utteranceError(String id) {
                  int[] p = parseId(id);
                  if (p == null || p[0] != token || !playing) return;
                  pauseNow(true, true);
                  Listener l = listener;
                  if (l != null) l.onError("Speech error");
              }

              // ---------------- state changes ----------------
              private void pauseNow(boolean emit, boolean abandon) {
                  playing = false;
                  pendingStart = false;
                  token++;
                  queue.clear();
                  curStarted = false;
                  try { if (tts != null) tts.stop(); } catch (Exception e) {}
                  releaseWake();
                  unregisterNoisy();
                  if (abandon) abandonFocus();
                  if (emit) { gen = -1; Listener l = listener; if (l != null) l.onState(false, index, false); }
                  refresh();
              }

              private void finishBook() {
                  playing = false;
                  token++;
                  queue.clear();
                  curStarted = false;
                  releaseWake();
                  unregisterNoisy();
                  abandonFocus();
                  Listener l = listener;
                  if (l != null) l.onState(false, index, true);
                  stopForeground(true);
                  stopSelf();
              }

              private void stopAll(boolean emit) {
                  playing = false;
                  pendingStart = false;
                  token++;
                  queue.clear();
                  curStarted = false;
                  try { if (tts != null) tts.stop(); } catch (Exception e) {}
                  releaseWake();
                  unregisterNoisy();
                  abandonFocus();
                  if (emit) { gen = -1; Listener l = listener; if (l != null) l.onState(false, index, false); }
                  stopForeground(true);
                  stopSelf();
              }

              // From the web page (gen identifies that request; settings are already stored in the statics).
              private void userPlayFromJs() { speakFrom(index); }

              // From the notification, lock screen, headset buttons.
              private void userPlay() {
                  gen = -1;
                  speakFrom(index);
                  Listener l = listener;
                  if (l != null) l.onState(true, index, false);
              }

              private void userPause() { pauseNow(true, true); }

              private void userJump(int delta) {
                  gen = -1;
                  int n = Math.max(0, Math.min(sentences.size() - 1, index + delta));
                  if (playing) {
                      speakFrom(n);
                  } else {
                      index = n;
                      refresh();
                  }
                  Listener l = listener;
                  if (l != null) l.onSentence(index, gen);
              }

              private void userStop() { stopAll(true); }

              // Called by the plugin (already on the main thread).
              void pauseFromJs() { pauseNow(false, true); }
              void stopFromJs() { stopAll(false); }

              // ---------------- audio focus, wake lock, headphones ----------------
              private final AudioManager.OnAudioFocusChangeListener focusListener = new AudioManager.OnAudioFocusChangeListener() {
                  @Override public void onAudioFocusChange(int change) {
                      if (change == AudioManager.AUDIOFOCUS_LOSS) {
                          resumeOnFocus = false;
                          if (playing) pauseNow(true, true);
                      } else if (change == AudioManager.AUDIOFOCUS_LOSS_TRANSIENT) {
                          if (playing) { resumeOnFocus = true; pauseNow(true, false); }
                      } else if (change == AudioManager.AUDIOFOCUS_GAIN) {
                          if (resumeOnFocus) { resumeOnFocus = false; userPlay(); }
                      }
                  }
              };

              private void requestFocus() {
                  try {
                      if (Build.VERSION.SDK_INT >= 26) {
                          if (focusReq == null) {
                              focusReq = new AudioFocusRequest.Builder(AudioManager.AUDIOFOCUS_GAIN)
                                      .setAudioAttributes(new AudioAttributes.Builder()
                                              .setUsage(AudioAttributes.USAGE_MEDIA)
                                              .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                                              .build())
                                      .setOnAudioFocusChangeListener(focusListener, handler)
                                      .build();
                          }
                          audio.requestAudioFocus(focusReq);
                      } else {
                          audio.requestAudioFocus(focusListener, AudioManager.STREAM_MUSIC, AudioManager.AUDIOFOCUS_GAIN);
                      }
                  } catch (Exception e) {}
              }

              private void abandonFocus() {
                  try {
                      if (Build.VERSION.SDK_INT >= 26) { if (focusReq != null) audio.abandonAudioFocusRequest(focusReq); }
                      else audio.abandonAudioFocus(focusListener);
                  } catch (Exception e) {}
              }

              private void acquireWake() {
                  try {
                      if (wakeLock == null) {
                          PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                          wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "reader:playback");
                          wakeLock.setReferenceCounted(false);
                      }
                      if (!wakeLock.isHeld()) wakeLock.acquire(8L * 60 * 60 * 1000);
                  } catch (Exception e) {}
              }

              private void releaseWake() {
                  try { if (wakeLock != null && wakeLock.isHeld()) wakeLock.release(); } catch (Exception e) {}
              }

              private final BroadcastReceiver noisy = new BroadcastReceiver() {
                  @Override public void onReceive(Context c, Intent i) {
                      if (playing) pauseNow(true, true);   // headphones unplugged
                  }
              };

              private void registerNoisy() {
                  if (noisyRegistered) return;
                  try { registerReceiver(noisy, new IntentFilter(AudioManager.ACTION_AUDIO_BECOMING_NOISY)); noisyRegistered = true; }
                  catch (Exception e) {}
              }

              private void unregisterNoisy() {
                  if (!noisyRegistered) return;
                  try { unregisterReceiver(noisy); } catch (Exception e) {}
                  noisyRegistered = false;
              }

              // ---------------- notification + lock screen ----------------
              private String currentLine() {
                  String s = textAt(index).replaceAll("\\s+", " ").trim();
                  if (s.length() > 110) s = s.substring(0, 107) + "...";
                  return s;
              }

              private void refresh() {
                  try {
                      updateSession();
                      nm.notify(NOTIF_ID, buildNotification());
                  } catch (Exception e) {}
              }

              private void updateSession() {
                  if (session == null) return;
                  int total = sentences.size();
                  session.setMetadata(new MediaMetadata.Builder()
                          .putString(MediaMetadata.METADATA_KEY_TITLE, title)
                          .putString(MediaMetadata.METADATA_KEY_ARTIST, currentLine())
                          .putString(MediaMetadata.METADATA_KEY_ALBUM, (index + 1) + " / " + total)
                          .build());
                  long actions = PlaybackState.ACTION_PLAY | PlaybackState.ACTION_PAUSE | PlaybackState.ACTION_PLAY_PAUSE
                          | PlaybackState.ACTION_SKIP_TO_NEXT | PlaybackState.ACTION_SKIP_TO_PREVIOUS | PlaybackState.ACTION_STOP;
                  session.setPlaybackState(new PlaybackState.Builder()
                          .setActions(actions)
                          .setState(playing ? PlaybackState.STATE_PLAYING : PlaybackState.STATE_PAUSED,
                                  PlaybackState.PLAYBACK_POSITION_UNKNOWN, playing ? 1f : 0f)
                          .build());
              }

              private PendingIntent actionIntent(String action, int code) {
                  Intent i = new Intent(this, ReaderPlaybackService.class).setAction(action);
                  return PendingIntent.getService(this, code, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              private Notification.Action act(int icon, String label, String action, int code) {
                  return new Notification.Action.Builder(Icon.createWithResource(this, icon), label, actionIntent(action, code)).build();
              }

              private Notification buildNotification() {
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26
                          ? new Notification.Builder(this, CHANNEL)
                          : new Notification.Builder(this);
                  Intent launch = getPackageManager().getLaunchIntentForPackage(getPackageName());
                  if (launch != null) {
                      b.setContentIntent(PendingIntent.getActivity(this, 0, launch,
                              PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE));
                  }
                  b.setSmallIcon(android.R.drawable.ic_media_play)
                          .setContentTitle(title)
                          .setContentText(currentLine())
                          .setOngoing(true)
                          .setShowWhen(false)
                          .setOnlyAlertOnce(true)
                          .setVisibility(Notification.VISIBILITY_PUBLIC)
                          .addAction(act(android.R.drawable.ic_media_previous, "Previous", A_PREV, 1))
                          .addAction(playing
                                  ? act(android.R.drawable.ic_media_pause, "Pause", A_TOGGLE, 2)
                                  : act(android.R.drawable.ic_media_play, "Play", A_TOGGLE, 2))
                          .addAction(act(android.R.drawable.ic_media_next, "Next", A_NEXT, 3))
                          .addAction(act(android.R.drawable.ic_menu_close_clear_cancel, "Stop", A_STOP, 4))
                          .setStyle(new Notification.MediaStyle()
                                  .setMediaSession(session.getSessionToken())
                                  .setShowActionsInCompactView(0, 1, 2));
                  if (Build.VERSION.SDK_INT < 26) b.setPriority(Notification.PRIORITY_LOW);
                  return b.build();
              }
          }
          JAVA
          cat > $DIR/ReaderPlaybackPlugin.java <<'JAVA'
          package com.reader.app;

          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          // Bridge between Reader.html and ReaderPlaybackService (background reading).
          @CapacitorPlugin(name = "ReaderPlayback")
          public class ReaderPlaybackPlugin extends Plugin {

              private final Handler main = new Handler(Looper.getMainLooper());

              @Override
              public void load() {
                  ReaderPlaybackService.listener = new ReaderPlaybackService.Listener() {
                      @Override public void onSentence(int index, int gen) {
                          JSObject o = new JSObject();
                          o.put("index", index);
                          o.put("gen", gen);
                          notifyListeners("sentence", o);
                      }
                      @Override public void onState(boolean playing, int index, boolean ended) {
                          JSObject o = new JSObject();
                          o.put("playing", playing);
                          o.put("index", index);
                          o.put("ended", ended);
                          notifyListeners("state", o);
                      }
                      @Override public void onError(String message) {
                          JSObject o = new JSObject();
                          o.put("message", message);
                          notifyListeners("error", o);
                      }
                  };
              }

              // Hand the document's sentences to the phone side (sent in chunks; reset = true on the first chunk).
              @PluginMethod
              public void setText(PluginCall call) {
                  try {
                      if (call.getBoolean("reset", false)) ReaderPlaybackService.sentences.clear();
                      JSArray arr = call.getArray("texts");
                      if (arr != null) {
                          java.util.ArrayList<String> part = new java.util.ArrayList<>(arr.length());
                          for (int i = 0; i < arr.length(); i++) part.add(arr.getString(i));
                          ReaderPlaybackService.sentences.addAll(part);
                      }
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("Could not load text: " + e.getMessage());
                  }
              }

              @PluginMethod
              public void play(PluginCall call) {
                  int count = ReaderPlaybackService.sentences.size();
                  if (count == 0) { call.reject("Nothing loaded"); return; }
                  ReaderPlaybackService.index = Math.max(0, Math.min(count - 1, call.getInt("index", 0)));
                  ReaderPlaybackService.rate = call.getFloat("rate", 1f);
                  String v = call.getString("voice", "");
                  ReaderPlaybackService.voiceKey = v == null ? "" : v;
                  ReaderPlaybackService.lang = call.getString("lang", "en-US");
                  ReaderPlaybackService.title = call.getString("title", "Reader");
                  ReaderPlaybackService.gen = call.getInt("gen", 0);
                  ReaderPlaybackService.loopA = call.getInt("loopA", -1);
                  ReaderPlaybackService.loopB = call.getInt("loopB", -1);
                  ReaderPlaybackService.repeatAll = call.getBoolean("repeat", false);
                  ReaderPlaybackService.playing = true;
                  Context ctx = getContext();
                  Intent i = new Intent(ctx, ReaderPlaybackService.class).setAction(ReaderPlaybackService.A_PLAY);
                  try {
                      if (Build.VERSION.SDK_INT >= 26) ctx.startForegroundService(i); else ctx.startService(i);
                      call.resolve();
                  } catch (Exception e) {
                      ReaderPlaybackService.playing = false;
                      call.reject("Could not start background playback: " + e.getMessage());
                  }
              }

              // A-B loop / repeat-file settings changed on the page.
              @PluginMethod
              public void setLoop(final PluginCall call) {
                  ReaderPlaybackService.loopA = call.getInt("a", -1);
                  ReaderPlaybackService.loopB = call.getInt("b", -1);
                  ReaderPlaybackService.repeatAll = call.getBoolean("repeat", false);
                  final ReaderPlaybackService s = ReaderPlaybackService.instance;
                  if (s != null) main.post(new Runnable() { @Override public void run() { s.loopChanged(); } });
                  call.resolve();
              }

              @PluginMethod
              public void pause(final PluginCall call) {
                  final ReaderPlaybackService s = ReaderPlaybackService.instance;
                  ReaderPlaybackService.playing = false;
                  if (s != null) main.post(new Runnable() { @Override public void run() { s.pauseFromJs(); } });
                  call.resolve();
              }

              @PluginMethod
              public void stop(final PluginCall call) {
                  final ReaderPlaybackService s = ReaderPlaybackService.instance;
                  ReaderPlaybackService.playing = false;
                  if (s != null) main.post(new Runnable() { @Override public void run() { s.stopFromJs(); } });
                  call.resolve();
              }

              @PluginMethod
              public void getState(PluginCall call) {
                  JSObject o = new JSObject();
                  o.put("active", ReaderPlaybackService.instance != null);
                  o.put("playing", ReaderPlaybackService.playing);
                  o.put("index", ReaderPlaybackService.index);
                  o.put("count", ReaderPlaybackService.sentences.size());
                  call.resolve(o);
              }
          }
          JAVA
      - name: Allow background playback (manifest)
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = (
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n'
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n'
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
              '    <uses-permission android:name="android.permission.WAKE_LOCK" />\n'
          )
          service = '        <service android:name=".ReaderPlaybackService" android:exported="false" android:foregroundServiceType="mediaPlayback" />\n'
          assert '<application' in s and '</application>' in s, 'unexpected manifest'
          s = s.replace('<application', perms + '    <application', 1)
          s = s.replace('</application>', service + '    </application>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          cat android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: reader-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
