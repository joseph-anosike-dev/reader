name: Build APK
on:
  push:
    paths:
      - '*.html'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install packages
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor-community/text-to-speech@6 esbuild
      - name: Prepare web files (bundle the speech plugin)
        run: |
          mkdir -p www
          cp "$(ls *.html | head -n1)" www/index.html
          cat > tts-entry.js <<'JS'
          import { Capacitor } from '@capacitor/core';
          import { TextToSpeech } from '@capacitor-community/text-to-speech';
          window.__TTS = Capacitor.isNativePlatform() ? TextToSpeech : null;
          JS
          npx esbuild tts-entry.js --bundle --format=iife --minify --outfile=www/tts.js
          sed -i '0,/<script>/s|<script>|<script src="tts.js"></script>\n<script>|' www/index.html
      - name: Create Android project
        run: |
          npx cap init Reader com.reader.app --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: reader-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
